name: Publicar GuildBook no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build && npm run export:standalone && npm test
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar site
        run: touch web/.nojekyll
      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirmar versão publicada
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for tentativa in 1 2 3 4 5 6; do
            curl --fail --location --silent --show-error "${SITE_URL}" --output pagina-publicada.html && break
            sleep 10
          done
          test -s pagina-publicada.html
          grep -F '<meta name="guildbook-version" content="Versão 6.3.1 · cadastros preservados e receitas com validação explícita">' pagina-publicada.html
          grep -F 'function getPrescription(medicineId,input={})' pagina-publicada.html
          grep -F 'Receita bloqueada: combinação sem validação clínica.' pagina-publicada.html
          grep -F "tb.treatment.firstLine=['rifampicina','isoniazida','pirazinamida','etambutol']" pagina-publicada.html
