name: Clinical and interface checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build && npm run export:standalone
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Verify generated artifacts
        run: git diff --exit-code -- GuildBook-v6-Site.html dist/server/index.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-screenshots
          path: test-results/
