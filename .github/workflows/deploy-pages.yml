name: Publicar GuildBook no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar site
        run: touch web/.nojekyll
      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirmar versão publicada
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for tentativa in 1 2 3 4 5 6; do
            curl --fail --location --silent --show-error "${SITE_URL}" --output pagina-publicada.html && break
            sleep 10
          done
          test -s pagina-publicada.html
          grep -F '<meta name="guildbook-version" content="Versão 6.2 · receituários e banco RENAME expandido">' pagina-publicada.html
          grep -F 'somente enquanto houver sintomas. Máximo: 4 g/dia.' pagina-publicada.html
          grep -F 'somente enquanto houver sintomas. Não combinar com outros produtos' pagina-publicada.html
          if grep -F 'Dipirona 500 mg, comprimidos. Tomar 1 comprimido por via oral a cada 6 horas se dor ou febre, por até 3 dias.' pagina-publicada.html; then exit 1; fi
          if grep -F 'Paracetamol 500 mg, comprimidos. Tomar 1 comprimido por via oral a cada 6 horas se dor ou febre, por até 3 dias.' pagina-publicada.html; then exit 1; fi
